services:
  - type: web
    name: fynd-operations-api
    runtime: docker
    plan: starter
    healthCheckPath: /health/live
    numInstances: 1
    disk:
      name: operations-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/operations-v2.db
      - key: REDIS_URL
        value: redis://127.0.0.1:6399/0
      - key: MOCK_AUTOSTART
        value: false
      - key: VERIFICATION_ENABLED
        value: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_MUTATIONS_PER_MINUTE
        value: "40"
      - key: MOCK_MAX_EVENTS_PER_SECOND
        value: "5"
      - key: MOCK_MAX_RUNTIME_SECONDS
        value: "300"
      - key: SNAPSHOT_RETENTION
        value: "300"
